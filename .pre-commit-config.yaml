#
# Local hooks regenerate files but don't `git add` the result — if one changes a
# tracked file, review the diff, `git add` it, and re-commit.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
        # A formatting hook rewriting a generated file makes CI red forever (generator
        # writes X -> hook rewrites X -> dev commits that -> CI regenerates X -> diff -> FAIL).
        # Not excluded from `reuse` lint: licence checks must still cover generated files.
        # No docs entry: appModule: 'boot' makes Jenkins diff 'boot/docs', but that directory
        # does not exist in this repo (nothing generates it) — see README.md.
        # db/migration/**: Flyway migrations are checksum-validated; a byte change to an
        # already-released migration (even just adding a trailing newline) breaks
        # `flyway validate` on every existing install. Never let a formatting hook touch them.
        exclude: &generated-files "^THIRDPARTIES$|^package/PKGBUILD$|^core/src/main/resources/db/migration/"
      - id: trailing-whitespace
        # Two trailing spaces are a hard line break in Markdown; stripping them changes rendering.
        args: [--markdown-linebreak-ext=md]
        exclude: *generated-files

  - repo: https://github.com/gruntwork-io/pre-commit
    rev: v0.1.30
    hooks:
      - id: shellcheck
        # Vendored verbatim from jenkins-lib-common; fix warnings upstream, then re-vendor.
        exclude: "^\\.ci/checksum-verify\\.sh$"

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []

  - repo: local
    hooks:
      - id: reuse-download-licenses
        name: reuse-download-licenses
        description: "Fetches missing SPDX licence texts into LICENSES/; `reuse lint` below never autofixes and hard-fails without them."
        entry: reuse
        args: [download, --all]
        language: python
        # Keep in sync with the `reuse` hook's rev below (v6.2.0) or the two silently drift.
        additional_dependencies: ["reuse==6.2.0"]
        pass_filenames: false
        always_run: true

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse

  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.16.0
    hooks:
      - id: pretty-format-java
        args: [--autofix]

  - repo: https://github.com/ejba/pre-commit-maven
    rev: v0.3.4
    hooks:
      - id: maven
        args: [ 'package', '--', '-DskipTests' ]

  - repo: local
    hooks:
      - id: comment-check
        name: comment-check
        description: "Warns on long // comment runs. Never blocks — it always exits 0."
        entry: bash .ci/comment-check.sh
        language: system
        types: [java]
        verbose: true

      - id: generate-thirdparties
        name: generate-thirdparties
        description: Regenerates THIRDPARTIES the same way Jenkins' verify stage does.
        entry: bash .ci/thirdparties/generate-thirdparties.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: checksum-verify-pkgbuild
        name: checksum-verify-pkgbuild
        description: "Verifies and autofixes package/PKGBUILD sha256sums; SKIP entries for remote/versioned sources stay untouched."
        entry: bash .ci/checksum-verify.sh package/PKGBUILD true
        language: system
        pass_filenames: false
        files: ^package/
