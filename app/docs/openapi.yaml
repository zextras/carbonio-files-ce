---
openapi: 3.1.0
components:
  schemas:
    CreateFolderRequest:
      type: object
      properties:
        userId:
          type: string
        destinationId:
          type: string
        name:
          type: string
    CreatePublicLinkRequest:
      type: object
      properties:
        userId:
          type: string
        nodeId:
          type: string
    DeleteAllRequest:
      type: object
      properties:
        userId:
          type: string
    DeleteAllResponse:
      type: object
      properties:
        deleted:
          type: boolean
    DependencyType:
      type: string
      enum:
      - OPTIONAL
      - REQUIRED
    HealthResponse:
      type: object
      properties:
        ready:
          type: boolean
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/ServiceHealth"
    InternalNodeDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        extension:
          type: string
        mimeType:
          type: string
        size:
          type: integer
          format: int64
        version:
          type: integer
          format: int32
        updatedAt:
          type: integer
          format: int64
        owner:
          $ref: "#/components/schemas/OwnerDto"
        parent:
          $ref: "#/components/schemas/ParentDto"
        permissions:
          $ref: "#/components/schemas/PermissionsDto"
    InternalNodeIdDto:
      type: object
      properties:
        nodeId:
          type: string
    OwnerDto:
      type: object
      properties:
        id:
          type: string
    ParentDto:
      type: object
      properties:
        id:
          type: string
    PermissionsDto:
      type: object
      properties:
        canWriteFile:
          type: boolean
    PublicLinkDto:
      type: object
      properties:
        url:
          type: string
    ServiceHealth:
      type: object
      properties:
        name:
          type: string
        ready:
          type: boolean
        live:
          type: boolean
        type:
          $ref: "#/components/schemas/DependencyType"
    UploadAttachmentResponse:
      type: object
      properties:
        attachmentId:
          type: string
    UploadResponse:
      type: object
      required:
      - node_id
      - version
      properties:
        node_id:
          type: string
        version:
          type: integer
          format: int32
    UploadVersionResponse:
      type: object
      properties:
        nodeId:
          type: string
        version:
          type: integer
          format: int32
      required:
      - version
    GraphqlRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
        operationName:
          type: string
        variables:
          type: object
        extensions:
          type: object
    GraphqlError:
      type: object
      required:
      - message
      properties:
        message:
          type: string
        locations:
          type: array
          items:
            type: object
            properties:
              line:
                type: integer
              column:
                type: integer
        path:
          type: array
          items: {}
        extensions:
          type: object
    GraphqlResponse:
      type: object
      properties:
        data:
          type: object
        errors:
          type: array
          items:
            $ref: "#/components/schemas/GraphqlError"
        extensions:
          type: object
    ApiVersionError:
      type: object
      properties:
        code:
          type: string
          enum:
          - INVALID_API_VERSION
          - UNSUPPORTED_API_VERSION
        message:
          type: string
        received:
          type: string
        oldestSupported:
          type: string
        current:
          type: string
  parameters:
    ApiVersionHeader:
      in: header
      name: X-FILES-API-VERSION
      required: false
      description: "The API version the client speaks: a semantic version or current.\
        \ Missing means current. The response repeats the version it was served at."
      schema:
        type: string
paths:
  /download-multiple:
    post:
      parameters:
      - required: false
        name: Cookie
        in: header
        schema:
          type: string
      - required: false
        name: ZM_AUTH_TOKEN
        in: cookie
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: string
              format: binary
        required: true
      responses:
        "401":
          description: Missing or invalid authentication cookie
        "403":
          description: "User not allowed (inactive, guest or feature disabled)"
        "200":
          description: ZIP archive of the requested nodes
          content:
            application/zip:
              schema:
                format: binary
                type: string
        "400":
          description: "Missing or malformed nodeIds The version header is malformed:\
            \ INVALID_API_VERSION (body ApiVersionError)."
        "404":
          description: Some nodes do not exist or are not accessible
        "413":
          description: Payload or file size exceeds the configured limit
        "415":
          description: Unsupported media type
        "503":
          description: "Transfer pool saturated, retry later"
        "500":
          description: Internal Server Error
        "422":
          description: "The version header names a version this server does not serve,\
            \ above the current one or below the oldest supported: UNSUPPORTED_API_VERSION\
            \ (body ApiVersionError)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiVersionError"
      summary: Download Multiple
      tags:
      - Blob Resource
  /download-multiple/check:
