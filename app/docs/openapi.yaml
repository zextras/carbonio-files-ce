components:
  schemas:
    CreateFolderRequest:
      type: object
      properties:
        userId:
          type: string
        destinationId:
          type: string
        name:
          type: string
    CreatePublicLinkRequest:
      type: object
      properties:
        userId:
          type: string
        nodeId:
          type: string
    DeleteAllRequest:
      type: object
      properties:
        userId:
          type: string
    DeleteAllResponse:
      type: object
      properties:
        deleted:
          type: boolean
    InternalNodeDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        extension:
          type: string
        mimeType:
          type: string
        size:
          type: integer
          format: int64
        version:
          type: integer
          format: int32
        updatedAt:
          type: integer
          format: int64
        owner:
          $ref: "#/components/schemas/OwnerDto"
        parent:
          $ref: "#/components/schemas/ParentDto"
        permissions:
          $ref: "#/components/schemas/PermissionsDto"
    InternalNodeIdDto:
      type: object
      properties:
        nodeId:
          type: string
    OwnerDto:
      type: object
      properties:
        id:
          type: string
    ParentDto:
      type: object
      properties:
        id:
          type: string
    PermissionsDto:
      type: object
      properties:
        canWriteFile:
          type: boolean
    PublicLinkDto:
      type: object
      properties:
        url:
          type: string
