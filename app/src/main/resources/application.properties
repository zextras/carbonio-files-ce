# Bootstrap extension: service name drives the Consul KV namespace (carbonio-files/...) and the
# config-file path (/etc/carbonio/files/config.properties).
carbonio.service.name=carbonio-files

# Packaging: build a single runnable uber-jar (app/target/*-runner.jar). The CI jarBuild stage
# and docker/Dockerfile consume it; the plain classes jar stays the Maven main artifact for
# carbonio-files (Advanced). Non-native for now — native is the eventual direction.
quarkus.package.jar.type=uber-jar

# @QuarkusIntegrationTest launches the runner jar as a child JVM which needs preview enabled for the
# FFM-based carbonio-systemd-notify readiness call (matches carbonio-files advanced).
%test.quarkus.test.arg-line=--enable-preview --enable-native-access=ALL-UNNAMED

# KV config-migration discovery scope. At build time the bootstrap extension Jandex-scans this
# package and writes the discovered ConfigMigration FQCNs to META-INF/carbonio-migrations.list.
# P8: V1__RenameDbCredentials migrates the legacy flat carbonio-files/db-* KV keys to the
# carbonio-quarkus-extensions-database nested carbonio-files/database/credentials/db-* path.
quarkus.carbonio-bootstrap.migrations-package=com.zextras.carbonio.files.config.migration

# Networking defaults (overridden at runtime by /etc/carbonio/files/config.properties).
# 127.78.0.2 is the assigned static mesh IP for carbonio-files (from package/carbonio-files.hcl).
networking-config.carbonio.service.host=127.78.0.2
networking-config.carbonio.service.port=10000
networking-config.carbonio.service-discover.host=127.0.0.1
networking-config.carbonio.service-discover.port=8500

# PostgreSQL upstream (mesh bind, see package/carbonio-files.hcl "carbonio-files-db" upstream).
# carbonio-quarkus-extensions-database reads db-name/db-username/db-password from Consul KV
# (carbonio-files/database/credentials/*) and combines them with this host/port to build the
# Agroal datasource; quarkus.datasource.db-kind is intentionally left UNSET (extension provides it).
networking-config.carbonio.postgresql.host=127.78.0.2
networking-config.carbonio.postgresql.port=20000

# Legacy parity: tag the JDBC connection as "files" (pg_stat_activity.application_name) and disable
# SSL (mesh traffic is already Consul-Connect-encrypted). The extension builds a plain
# jdbc:postgresql://host:port/db URL with no query params, so these are appended as driver
# connection properties without conflicting with it.
quarkus.datasource.jdbc.additional-jdbc-properties.ApplicationName=files
quarkus.datasource.jdbc.additional-jdbc-properties.sslmode=disable

# user-management upstream (mesh bind, see package/carbonio-files.hcl "carbonio-user-management"
# upstream). Used by the UserResourceApi REST SDK client (UserManagementClientProducer) in
# UserRepositoryImpl.
networking-config.carbonio.user-management.host=127.78.0.2
networking-config.carbonio.user-management.port=20001

# carbonio-storages upstream (mesh bind, see package/carbonio-files.hcl "carbonio-storages"
# upstream, local_bind_port 20002). Used by the Filestore CDI bean (FilestoreProducer) that
# NodeDataFetcher calls for blob bulkDelete.
networking-config.carbonio.storages.host=127.78.0.2
networking-config.carbonio.storages.port=20002

# Flyway: baseline for existing installations that predate Flyway (devel used Guice/Ebean without
# schema history table).
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0

quarkus.hibernate-orm.jdbc.timezone=UTC

# --- Code-first GraphQL (quarkus-smallrye-graphql) ---
# The schema is code-first (derived from the @GraphQLApi/@Type beans and registered by
# quarkus-smallrye-graphql at build time), so no SDL resource files are read at runtime — the
# schema-first api/*.graphql includes and the graphql-java native entries are gone.
#
# Introspection: enabled by default (needed by the acceptance/IT introspection tooling), disabled
# in prod. schema-available=false in prod hides the SDL download endpoint (/graphql/schema.graphql).
quarkus.smallrye-graphql.schema-include-introspection-types=true
%prod.quarkus.smallrye-graphql.schema-include-introspection-types=false
%prod.quarkus.smallrye-graphql.schema-available=false
# Apollo Federation is auto-enabled by SmallRye whenever federation-graphql-java-support is on the
# classpath (it now arrives transitively via quarkus-smallrye-graphql). Files is NOT a federated
# subgraph, and the frozen schema contract (docs/schema.graphql) has no _Service/_entities types, so
# federation is disabled to keep the served schema equal to the contract. (The in-JVM contract gate
# SchemaContractTest sets the equivalent smallrye.graphql.federation.enabled=false via surefire.)
quarkus.smallrye-graphql.federation.enabled=false
# The SmallRye root-path defaults to /graphql. Permit the HTTP layer to reach both the endpoint and
# its SDL download; per-operation @Authenticated/@PermitAll enforce access, and
# FilesGraphQLAuthMechanism turns the cookie into the identity.
quarkus.http.auth.permission.graphql.paths=/graphql,/graphql/schema.graphql
quarkus.http.auth.permission.graphql.policy=permit
# Extension field processing: enabling errorExtensionFields causes SmallRye to call
# ErrorExtensionProvider.mapValueFrom() and merge those results into the error extensions object
# (in addition to the always-included "classification"). Without this, SmallRye skips its own
# extension pipeline and only the graphql-java toSpecification() extensions survive (classification
# only). Including "errorCode" here activates FilesErrorCodeExtension for ALL DataFetching errors.
quarkus.smallrye-graphql.error-extension-fields=classification,errorCode
# Surface a clear message for UnauthorizedException instead of "System error" when an anonymous
# identity hits an @Authenticated operation. The exception has a null message, so the error JSON
# shows "message":null — acceptable (not "System error", errorCode makes it machine-detectable).
quarkus.smallrye-graphql.show-runtime-exception-message=io.quarkus.security.UnauthorizedException

# --- P7 native image ---
# org.postgresql.sspi.SSPIClient references Windows-only waffle/JNA classes and must not be
# initialized during the build (matches carbonio-tasks-ce). quarkus-smallrye-graphql registers
# SmallRye's own native needs at build time, so no graphql-java entries are needed here.
quarkus.native.additional-build-args=--initialize-at-run-time=org.postgresql.sspi.SSPIClient

# P2c: batches JDBC inserts/updates issued by bulk repository operations (e.g. Share upsert/delete
# loops in ShareRepositoryImpl); analogous to the JDBC batch mode the old Ebean impl set manually.
quarkus.hibernate-orm.jdbc.statement-batch-size=50

# Health: the legacy custom JAX-RS routes /health, /health/live, /health/ready (HealthResource) are
# intentionally KEPT — the frontend depends on GET /health for the dependency report. The built-in
# Quarkus SmallRye endpoints under /q/health/* (via carbonio-quarkus-extensions-bootstrap) are
# ADDITIONAL; the mesh check in package/carbonio-files.hcl points at /q/health/live (matching
# carbonio-tasks).

# Legacy parity: Constants.API.Endpoints.METRICS is "/metrics" (root-level, unauthenticated, see
# HttpRoutingHandler). quarkus-micrometer-registry-prometheus defaults to serving its scrape at
# ${root-path}/${non-application-root-path}/metrics (i.e. /q/metrics); an absolute path here makes
# it serve straight from /metrics instead.
quarkus.micrometer.export.prometheus.path=/metrics

# P3c: FilesConfig tunables consumed by the GraphQL DataFetchers.
# max-uploadable/downloadable-size-in-mb have no default here on purpose: legacy treated a missing
# Consul KV value as "no limit" (Optional.empty()), not as a fallback number.
application-config.max-number-of-versions=30
networking-config.carbonio.files.enable-notifications=true

# Disable the Quarkus HTTP body-size cap (default 10 MiB) so it never pre-empts the application's
# own upload limit. An EMPTY value means "no HTTP-layer limit" (per Quarkus). The ONLY upload-size
# governor is then the app config max-uploadable-size-in-mb (Consul KV; unset = unlimited), enforced
# by BlobResource.isRequestSizeOverLimit. Safe: uploads stream to storages on the transfer pool, so
# there is no whole-body buffering to protect against here.
quarkus.http.limits.max-body-size=

# Match the sidecar upload window (package/carbonio-files.hcl local_request_timeout_ms=3600000);
# legacy Netty set no server read timeout, and Quarkus' 60s default would kill long uploads.
quarkus.http.read-timeout=3600s

# Transfer pool: bounds the dedicated thread pool (TransferPool) that runs the heavy REST
# byte-transfer endpoints (blob upload / single + ZIP download) off the event loop and off the
# shared worker pool. KV-overridable via carbonio-files/transfer/{max-threads,queue-size}.
application-config.transfer.max-threads=64
application-config.transfer.queue-size=256

# P5: message-broker upstream (mesh bind). Used by the MessageBrokerClient CDI bean
# (MessageBrokerClientProducer) that MessageBrokerManagerImpl connects/starts consumers with.
networking-config.carbonio.message-broker.host=127.78.0.2
networking-config.carbonio.message-broker.port=20006

# P5: PurgeService scheduled job — legacy default was a 30-minute fixed-rate interval.
carbonio.files.purge.interval=30m

# P5b: carbonio-preview upstream (mesh bind, see package/carbonio-files.hcl "carbonio-preview"
# upstream, local_bind_port 20003). Used by PreviewClientProducer (PreviewResource passthrough).
networking-config.carbonio.preview.host=127.78.0.2
networking-config.carbonio.preview.port=20003

# P5b: carbonio-mailbox upstream (mesh bind, see package/carbonio-files.hcl "carbonio-mailbox"
# upstream, local_bind_port 20004). Used by MailboxHttpClient (ProcedureResource /upload-to).
networking-config.carbonio.mailbox.host=127.78.0.2
networking-config.carbonio.mailbox.port=20004

# carbonio-docs-connector upstream (mesh bind, see package/carbonio-files.hcl
# "carbonio-docs-connector" upstream, local_bind_port 20005). Used by DocsConnectorHttpClient.
networking-config.carbonio.docs-connector.host=127.78.0.2
networking-config.carbonio.docs-connector.port=20005

# --- Test profile: containers/consul are managed by the test resource; disable DevServices. ---
%test.quarkus.devservices.enabled=false
%test.networking-config.carbonio.service.host=localhost

# Keep the acceptance-suite test logs readable/fast: silence the very chatty wire/transport DEBUG
# from Testcontainers' docker-java client and the Netty stack (these dominate the run log).
%test.quarkus.log.category."com.github.dockerjava".level=WARN
%test.quarkus.log.category."org.testcontainers".level=WARN
%test.quarkus.log.category."io.netty".level=WARN
%test.quarkus.log.category."org.jboss.resteasy.reactive".level=WARN
%test.quarkus.log.category."org.eclipse.jetty".level=WARN
%test.quarkus.log.category."org.wiremock".level=WARN
%test.quarkus.log.category."com.github.tomakehurst".level=WARN
%test.quarkus.log.category."WireMock".level=WARN
%test.quarkus.log.category."org.hibernate".level=WARN

# P5: no RabbitMQ broker is stood up for the DAL/GraphQL/REST/purge integration tests yet (that is
# the P5c acceptance seam); MessageBrokerManagerImpl degrades gracefully (healthCheck() == false)
# regardless, but avoid it retrying a connection at all during the run. Likewise the purge
# scheduler must never fire on its own timer during tests: PurgeServiceIT invokes
# purgeTrashedNodes()/purgeTombstones() directly.
%test.quarkus.scheduler.enabled=false
