openapi: 3.0.3
info:
  title: Files API
  description: Files API to download blobs and to retrieve a link of a specific node.
  version: 0.3.0
servers:
  - url: 'https://example.com/services/files/public/'
paths:

  /download/{nodeId}:
    get:
      description: Downloads the last version of a node if it has a valid public link associated.
      operationId: downloadNodeLastVersion
      parameters:
        - in: path
          name: nodeId
          description: The id of the node to download
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: node_link_id
          description: The id of the node link
          required: true
          schema:
            type: string
        - in: query
          name: access_code
          description: The access code for protected links
          required: false
          schema:
            type: string
      responses:
        200:
          $ref: '#/components/responses/200DownloadNode'
        400:
          $ref: '#/components/responses/400BadRequest'
        404:
          $ref: '#/components/responses/404NotFound'
        503:
          $ref: '#/components/responses/503BadGateway'

  /download/{nodeId}/check:
    get:
      description: Preliminary check for downloading the last version of a node if it has a valid public link associated
      operationId: checkDownloadNodeLastVersion
      parameters:
        - in: path
          name: nodeId
          description: The id of the node to download
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: node_link_id
          description: The id of the node link
          required: true
          schema:
            type: string
        - in: query
          name: access_code
          description: The access code for protected links
          required: false
          schema:
            type: string
      responses:
        204:
          description: Check completed successfully - node is ready for download
        400:
          $ref: '#/components/responses/400BadRequest'
        404:
          $ref: '#/components/responses/404NotFound'
        503:
          $ref: '#/components/responses/503BadGateway'

  /download-multiple:
    post:
      description: Downloads multiple nodes by their IDs if they have a valid public link associated
      operationId: downloadMultipleNodes
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                nodeIds:
                  type: string
                  description: JSON stringified array of node IDs
                  example: '["abc123","def456","ghi789"]'
                node_link_id:
                  type: string
                  description: The id of the node link for all nodes
                access_code:
                  type: string
                  description: The access code for protected links
                  required: false
              required:
                - nodeIds
                - node_link_id
      responses:
        200:
          $ref: '#/components/responses/200DownloadNode'
        400:
          $ref: '#/components/responses/400BadRequest'
        404:
          $ref: '#/components/responses/404NotFound'
        503:
          $ref: '#/components/responses/503BadGateway'

  /download-multiple/check:
    post:
      description: Preliminary check for downloading multiple nodes by their IDs if they have a valid public link associated
      operationId: checkDownloadMultipleNodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nodeIds:
                  type: array
                  items:
                    type: string
                  description: Array of node IDs
                  example: [ "abc123","def456","ghi789" ]
                node_link_id:
                  type: string
                  description: The id of the node link for all nodes
                access_code:
                  type: string
                  description: The access code for protected links
                  required: false
              required:
                - nodeIds
                - node_link_id
      responses:
        204:
          description: Check completed successfully - zip is ready for download
        400:
          $ref: '#/components/responses/400BadRequest'
        404:
          $ref: '#/components/responses/404NotFound'
        503:
          $ref: '#/components/responses/503BadGateway'

  /link/download/{linkId}:
    get:
      description: Download the node associated to the specific link
      operationId: downloadNodeLastVersionByPublicLink
      parameters:
        - in: path
          name: linkId
          description: The id of the existing link
          required: true
          allowEmptyValue: false
          schema:
            type: string
            minLength: 8
            maxLength: 8
      responses:
        200:
          $ref: '#/components/responses/200DownloadNode'
        400:
          $ref: '#/components/responses/400BadRequest'
        404:
          $ref: '#/components/responses/404NotFound'
        503:
          $ref: '#/components/responses/503BadGateway'

components:
  parameters:
    pathNodeId:
      in: path
      name: nodeId
      schema:
        title: Id
        type: string
      required: true
  responses:
    200DownloadNode:
      description: The node to download
      content:
        application/octet-stream:
          schema:
            $ref: '#/components/schemas/NodeBinary'
    400BadRequest:
      description: The request was malformed
    404NotFound:
      description: The resource was not found
    502BadGateway:
      description: The service was unavailable
  schemas:
    NodeBinary:
      type: object
      properties:
        file:
          type: string
          format: binary
