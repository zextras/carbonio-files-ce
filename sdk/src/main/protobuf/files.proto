syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.zextras.carbonio.files.grpc.sdk";

package files;

// Trusted-caller gRPC surface for backend-to-backend calls (replaces the old
// cookie-based carbonio-files-sdk HTTP client). Every RPC carries the
// caller-provided user_id directly instead of a cookie/token: the caller is
// assumed already authenticated/authorized, there is no auth performed here.
service FilesService {
  rpc UploadFile (stream UploadFileRequest) returns (UploadFileResponse);
  rpc UploadFileVersion (stream UploadFileVersionRequest) returns (UploadFileVersionResponse);
  rpc DownloadFile (DownloadFileRequest) returns (stream DownloadFileResponse);
  rpc CreatePublicLink (CreatePublicLinkRequest) returns (CreatePublicLinkResponse);
  rpc DeleteAllNodesAndBlobs (DeleteAllNodesAndBlobsRequest) returns (DeleteAllNodesAndBlobsResponse);
}

// --- Domain entities, mirroring the concrete objects the old FilesClient returned ---

message NodeIdProto {
  string node_id = 1;
}

message NodeIdVersionProto {
  string node_id = 1;
  int32 version = 2;
}

message PublicLinkProto {
  string url = 1;
}

// --- UploadFile: mirrors FilesClient#uploadFile / InternalFilesClient#uploadFile.
// The old SDK had a separate "internal" upload (AccountId header, no cookie) purely
// to bypass cookie auth; here every RPC is already trusted-caller, so the two
// collapse into this single RPC. Client-streaming: one leading metadata message
// followed by chunk_data messages carrying the raw blob bytes. ---

message UploadFileMetadata {
  string user_id = 1;
  string destination_folder_id = 2;
  string filename = 3;
  string mime_type = 4;
}

message UploadFileRequest {
  oneof payload {
    UploadFileMetadata metadata = 1;
    bytes chunk_data = 2;
  }
}

message UploadFileResponse {
  NodeIdProto node = 1;
}

// --- UploadFileVersion: mirrors FilesClient#uploadFileVersion. Same
// leading-metadata + chunk_data client-streaming shape as UploadFile. ---

message UploadFileVersionMetadata {
  string user_id = 1;
  string node_id = 2;
  string filename = 3;
  string mime_type = 4;
  bool overwrite = 5;
}

message UploadFileVersionRequest {
  oneof payload {
    UploadFileVersionMetadata metadata = 1;
    bytes chunk_data = 2;
  }
}

message UploadFileVersionResponse {
  NodeIdVersionProto node = 1;
}

// --- DownloadFile: mirrors FilesClient#downloadFile(cookie, nodeId, optVersion).
// Server-streaming: one leading metadata message (blob size, replacing the old
// Content-Length header read) followed by chunk_data messages. ---

message DownloadFileRequest {
  string user_id = 1;
  string node_id = 2;
  optional int32 version = 3;
}

message DownloadFileMetadata {
  int64 size = 1;
}

message DownloadFileResponse {
  oneof payload {
    DownloadFileMetadata metadata = 1;
    bytes chunk_data = 2;
  }
}

// --- CreatePublicLink: mirrors FilesClient#createPublicLink, which was built by
// hand-formatting a "createLink" GraphQL mutation string. Promoted here to a
// first-class typed RPC (no raw GraphQL passthrough is exposed by this SDK). ---

message CreatePublicLinkRequest {
  string user_id = 1;
  string node_id = 2;
}

message CreatePublicLinkResponse {
  PublicLinkProto link = 1;
}

// --- DeleteAllNodesAndBlobs: mirrors InternalFilesClient#deleteAllNodesAndBlobs,
// which was built by hand-formatting a "deleteAllNodesAndBlobs" GraphQL mutation
// string. Promoted here to a first-class typed RPC. ---

message DeleteAllNodesAndBlobsRequest {
  string user_id = 1;
}

message DeleteAllNodesAndBlobsResponse {
  bool deleted = 1;
}
